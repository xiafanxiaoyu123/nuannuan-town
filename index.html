<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>暖暖的方块小镇 · 同人模拟经营</title>
  <meta name="description" content="以暖暖为主角的方块风 3D 模拟经营同人游戏：打工、种田、换装、布置家园。" />
  <meta name="theme-color" content="#ffd9e6" />
  <script>
    // 临时开放资源更新；后续签名资源发布可改为 false，恢复会员权益检查。
    window.__NIKKI_PUBLIC_FREE_UPDATES__ = false;
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='14' width='48' height='42' rx='12' fill='%23ffe4d6'/%3E%3Crect x='6' y='8' width='52' height='20' rx='9' fill='%23ffb3cb'/%3E%3Crect x='20' y='34' width='6' height='10' rx='2' fill='%237a3f6b'/%3E%3Crect x='38' y='34' width='6' height='10' rx='2' fill='%237a3f6b'/%3E%3C/svg%3E" />
  <!-- 单机版：不依赖任何网络资源，字体使用系统自带中文字体 -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/live.css" />
  <link rel="stylesheet" href="css/wardrobe-layout.css" />
  <link rel="stylesheet" href="css/preferences.css" />
  <link rel="stylesheet" href="css/piano.css" />
  <link rel="stylesheet" href="css/tailor.css" />
  <link rel="stylesheet" href="css/modal-layout.css" />
  <link rel="stylesheet" href="css/result-layout.css" />
  <link rel="stylesheet" href="css/diagnostics.css" />
  <script type="importmap">
    { "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
  </script>
</head>
<body>
  <canvas id="stage" aria-label="暖暖的方块小镇 3D 场景"></canvas>
  <div id="ui"></div>
  <div id="iris" aria-hidden="true"></div>
  <div id="boot">
    <div class="boot-card">
      <div class="boot-cube"><i></i><i></i><i></i></div>
      <p>正在搭建方块小镇…</p>
    </div>
  </div>
  <noscript>这个游戏需要启用 JavaScript 与 WebGL。</noscript>
  <script>
    // 捕获主模块加载/解析失败，以及慢设备上的启动超时；正常进入游戏后自动失效。
    (() => {
      const bootText = (message, retry = false) => {
        const root = document.getElementById('boot');
        if (!root || window.__game) return;
        root.classList.remove('out');
        const p = root.querySelector('p');
        if (p) p.textContent = message;
        if (retry && !root.querySelector('[data-boot-retry]')) {
          const button = document.createElement('button');
          button.type = 'button';
          button.dataset.bootRetry = '1';
          button.textContent = '重新加载';
          button.style.cssText = 'margin-top:16px;padding:9px 18px;border:0;border-radius:999px;background:#fff;color:#6b4f3f;font:inherit;cursor:pointer';
          button.addEventListener('click', () => location.reload());
          root.appendChild(button);
        }
      };
      window.__showBootError = bootText;
      window.addEventListener('error', (event) => {
        if (!window.__game && (event.error || /module|script|three/i.test(event.message || ''))) {
          bootText('游戏资源加载失败，请检查网络后重试', true);
        }
      }, true);
      window.addEventListener('unhandledrejection', (event) => {
        if (!window.__game) bootText('启动失败：' + (event.reason?.message || '资源加载异常'), true);
      });
      setTimeout(() => {
        if (!window.__game) bootText('启动时间较长，正在继续准备场景…');
      }, 15000);
    })();
  </script>
  <script type="module" src="js/desktop-updates.js"></script>
  <script type="module" src="js/mobile-updates.js"></script>
  <script type="module">
    import('./js/main.js').catch((error) => {
      window.__showBootError?.('启动失败：' + (error.message || '主脚本加载失败'), true);
    });
  </script>
</body>
</html>
